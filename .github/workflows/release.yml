name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: test "$(printf '%s' "$TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')" = "$TAG"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
